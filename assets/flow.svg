<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0a0b0d"/><text x="60" y="72" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="34" font-weight="700" letter-spacing="3">ONE METERED PAYMENT</text><text x="60" y="104" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="18">The payer signs. The payer never broadcasts. The payer never holds gas.</text><rect x="60" y="150" width="880" height="96" fill="none" stroke="#24272e" stroke-width="2" stroke-dasharray="7 6"/><text x="80" y="182" fill="#e6b85b" font-family="'JetBrains Mono','Consolas',monospace" font-size="14" letter-spacing="2">FUNDING, ONCE</text><text x="80" y="215" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="19">XRP on XRPL  +  one payment memo  &#8594;  Flare Smart Account  &#8594;  FXRP minted to the agent</text><line x1="210" y1="246" x2="210" y2="384" stroke="#e6b85b" stroke-width="2" stroke-dasharray="7 6"/><polygon points="210,430 201,414 219,414" fill="#e6b85b"/><rect x="60" y="430" width="250" height="112" fill="#111318" stroke="#5be6a8" stroke-width="3"/><text x="185" y="470" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="23" font-weight="700" letter-spacing="1" text-anchor="middle">AGENT</text><text x="185" y="502" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" text-anchor="middle">holds FXRP</text><text x="185" y="527" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" text-anchor="middle">holds 0 gas</text><rect x="470" y="430" width="250" height="112" fill="#111318" stroke="#24272e" stroke-width="2"/><text x="595" y="470" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="23" font-weight="700" letter-spacing="1" text-anchor="middle">FACILITATOR</text><text x="595" y="502" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" text-anchor="middle">pays every gas fee</text><rect x="880" y="430" width="250" height="112" fill="#111318" stroke="#24272e" stroke-width="2"/><text x="1005" y="470" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="23" font-weight="700" letter-spacing="1" text-anchor="middle">FXRP3009</text><text x="1005" y="502" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" text-anchor="middle">the EIP-3009 shim</text><text x="1005" y="527" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" text-anchor="middle">custodies nothing</text><rect x="1290" y="430" width="250" height="112" fill="#111318" stroke="#5be6a8" stroke-width="3"/><text x="1415" y="470" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="23" font-weight="700" letter-spacing="1" text-anchor="middle">PROVIDER</text><text x="1415" y="502" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" text-anchor="middle">receives real FXRP</text><line x1="310" y1="486" x2="456" y2="486" stroke="#5be6a8" stroke-width="3"/><polygon points="470,486 455,477 455,495" fill="#5be6a8"/><text x="390" y="468" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" text-anchor="middle">signs</text><text x="390" y="518" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="14" text-anchor="middle">free, off-chain</text><line x1="720" y1="486" x2="866" y2="486" stroke="#5be6a8" stroke-width="3"/><polygon points="880,486 865,477 865,495" fill="#5be6a8"/><text x="800" y="468" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" text-anchor="middle">broadcasts</text><text x="800" y="518" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="14" text-anchor="middle">pays the gas</text><line x1="1130" y1="486" x2="1276" y2="486" stroke="#5be6a8" stroke-width="3"/><polygon points="1290,486 1275,477 1275,495" fill="#5be6a8"/><text x="1210" y="468" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" text-anchor="middle">moves FXRP</text><text x="1210" y="518" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="14" text-anchor="middle">via the allowance</text><line x1="60" y1="640" x2="1540" y2="640" stroke="#24272e" stroke-width="2"/><text x="60" y="690" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" letter-spacing="1.5">ONE PERMIT PER SESSION</text><text x="330" y="690" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17">opens the allowance gaslessly. Every tick after is a pure EIP-3009 authorization.</text><text x="60" y="730" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" letter-spacing="1.5">FTSO</text><text x="330" y="730" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17">prices the stream in USD/second and converts to FXRP at settlement time.</text><text x="60" y="770" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" letter-spacing="1.5">THE NONCE</text><text x="330" y="770" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17">carries the tick&#8217;s duration in its low 6 bytes, so metering lands on-chain for free.</text><text x="60" y="810" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" letter-spacing="1.5">STANDARD TYPEHASHES</text><text x="330" y="810" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17">so an unmodified x402 client and facilitator both work against it.</text></svg>