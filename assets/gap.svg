<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0b0d"/><text x="90" y="110" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="38" font-weight="700" letter-spacing="2">THE GAP, CHECKED ON-CHAIN</text><text x="90" y="152" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="20">Called against the deployed FXRP contract on both networks. Not read from the docs.</text><text x="90" y="274" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" letter-spacing="2">FUNCTION ON FXRP</text><text x="760" y="274" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" letter-spacing="2" text-anchor="middle">COSTON2</text><text x="1120" y="274" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="17" letter-spacing="2" text-anchor="middle">MAINNET</text><line x1="90" y1="292" x2="1510" y2="292" stroke="#5be6a8" stroke-width="3"/><text x="90" y="348" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">permit  (EIP-2612)</text><text x="760" y="348" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">YES</text><text x="1120" y="348" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">YES</text><rect x="70" y="374" width="1460" height="74" fill="#111318"/><text x="90" y="422" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">nonces  (EIP-2612)</text><text x="760" y="422" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">YES</text><text x="1120" y="422" fill="#5be6a8" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">YES</text><text x="90" y="496" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">transferWithAuthorization</text><text x="760" y="496" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><text x="1120" y="496" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><rect x="70" y="522" width="1460" height="74" fill="#111318"/><text x="90" y="570" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">receiveWithAuthorization</text><text x="760" y="570" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><text x="1120" y="570" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><text x="90" y="644" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">cancelAuthorization</text><text x="760" y="644" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><text x="1120" y="644" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><rect x="70" y="670" width="1460" height="74" fill="#111318"/><text x="90" y="718" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">authorizationState</text><text x="760" y="718" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><text x="1120" y="718" fill="#e6685b" font-family="'JetBrains Mono','Consolas',monospace" font-size="26" font-weight="700" text-anchor="middle">NO</text><line x1="90" y1="752" x2="1510" y2="752" stroke="#24272e" stroke-width="2"/><text x="90" y="810" fill="#eef0f3" font-family="'JetBrains Mono','Consolas',monospace" font-size="24">FXRP has gasless approvals. It has no way to be paid <tspan fill="#5be6a8">with</tspan> an authorization.</text><text x="90" y="850" fill="#8a8f98" font-family="'JetBrains Mono','Consolas',monospace" font-size="21">That is the one thing x402 needs, and the only thing FXRP3009 adds.</text></svg>